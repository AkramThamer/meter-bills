name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org com.example --platforms android --project-name meter_bill .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
      - name: Allow SMS and WhatsApp links
        run: |
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Make app icon
        run: |
          pip install pillow
          mkdir -p assets
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          S = 1024
          im = Image.new('RGB', (S, S), (0, 121, 107))
          d = ImageDraw.Draw(im)
          d.ellipse((112, 112, 912, 912), fill=(255, 255, 255))
          d.polygon([(560, 170), (330, 560), (490, 560), (440, 860), (700, 440), (540, 440)], fill=(255, 179, 0))
          d.polygon([(760, 520), (690, 640), (830, 640)], fill=(2, 136, 209))
          d.ellipse((690, 590, 830, 730), fill=(2, 136, 209))
          im.save('assets/icon.png')
          PYEOF
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: meter-bill-apk
          path: build/app/outputs/flutter-apk/app-release.apk
